name: CI/CD Pipeline - Payment API

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REPOSITORY: payment-repo
  IMAGE: payment-api

jobs:
  ci-cd:
    name: Continuous Integration & Delivery
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write # Necessário para o Workload Identity Federation

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    # 1. Autenticação segura na GCP sem chaves estáticas
    - name: Autenticar na GCP via Workload Identity
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    # 2. Configurar o Docker para autenticar no Artifact Registry
    - name: Configurar Docker com GCP
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    # 3. Validação do Terraform (CI)
    - name: Configurar Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.5.7

    - name: Terraform Init e Validate
      working-directory: ./terraform
      run: |
        terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
        terraform validate

    # 4. Build e Push da Imagem Docker (CI)
    - name: Build e Push da Imagem para o Artifact Registry
      env:
        COMMIT_SHA: ${{ github.sha }}
      run: |
        IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ env.COMMIT_SHA }}"
        LATEST_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"
        
        docker build -t $IMAGE_TAG -t $LATEST_TAG .
        docker push $IMAGE_TAG
        docker push $LATEST_TAG

    # 5. Aplicar Infraestrutura com Terraform (CD)
    - name: Terraform Apply
      working-directory: ./terraform
      run: terraform apply -auto-approve

    # 6. Conectar ao GKE e atualizar a aplicação (CD)
    - name: Obter Credenciais do GKE
      run: gcloud container clusters get-credentials gke-prod-payment --region ${{ env.REGION }}

    - name: Deploy no Kubernetes
      run: |
        # Atualizar dinamicamente a imagem no deployment se necessário ou aplicar manifestos
        kubectl apply -f k8s/
        kubectl rollout status deployment/payment-api